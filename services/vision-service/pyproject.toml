[project]
name = "vision-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6", "numpy>=1.26", "opencv-python-headless>=4.9", "pillow>=10", "rapidfuzz>=3.6", "python-multipart>=0.0.9"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["vision"]
