[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpa-sim"
version = "0.1.0"
description = "Scripted insurer/TPA/bank simulator (Dev B)"
requires-python = ">=3.12"
dependencies = ["claim-contract", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pyyaml>=6", "sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.20", "jinja2>=3.1", "pydantic>=2.7", "pydantic-settings>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tpa_sim*"]

[tool.setuptools.package-data]
tpa_sim = ["templates/*.html"]
