[project]
name = "doc-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6", "cryptography>=42", "rapidfuzz>=3.6", "pillow>=10", "python-multipart>=0.0.9", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7", "en-core-web-sm"]
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "reportlab>=4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["docpipe"]
