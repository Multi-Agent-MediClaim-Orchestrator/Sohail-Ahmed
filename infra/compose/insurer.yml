# Dev B insurer services (profile `insurer`). Build context is the repo root.
services:
  insurer-api:
    build: {context: ../.., dockerfile: insurer/api/Dockerfile}
    profiles: ["insurer"]
    restart: unless-stopped
    depends_on:
      insurer-db: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      INS_DATABASE_URL: postgresql+asyncpg://ins_app:${INS_APP_DB_PASSWORD:-ins_app_dev}@insurer-db:5432/insurer
      INS_OWNER_DATABASE_URL: postgresql://postgres:${INS_PG_SUPERUSER_PASSWORD:-postgres}@insurer-db:5432/insurer
      INS_REDIS_URL: redis://redis:6379/0
      INS_MINIO_ENDPOINT: minio:9000
      INS_CREW_URL: http://insurer-crew:8110
      INS_RAG_URL: http://rag-service:8400
      INS_CALC_ENGINE_URL: http://calc-engine:8120
      INS_CALC_REMOTE: "true"
      INS_TPA_SIM_URL: http://tpa-sim:8500
      INS_SETTLEMENT_MODE: sim               # never anything else: no real money
      INS_ORCHESTRATOR: ${INS_ORCHESTRATOR:-inline}
      INS_HOSPITAL_CALLBACK_BASE: ${HOSPITAL_API_URL:-http://host.docker.internal:8000}
    env_file: [{path: ../../.env, required: false}]
    ports: ["127.0.0.1:8100:8100"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/v1/health')"], interval: 10s, timeout: 3s, retries: 12}
    mem_limit: 768m

  calc-engine:
    build: {context: ../.., dockerfile: insurer/calc_engine/Dockerfile}
    profiles: ["insurer"]
    restart: unless-stopped
    ports: ["127.0.0.1:8120:8120"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8120/v1/health')"], interval: 10s, timeout: 3s, retries: 10}
    mem_limit: 256m

  insurer-crew:
    build: {context: ../.., dockerfile: insurer/crew/Dockerfile}
    profiles: ["insurer"]
    restart: unless-stopped
    depends_on: {redis: {condition: service_healthy}}
    environment:
      INS_LLM_GATEWAY_URL: http://llm-gateway:4000
      INS_RAG_URL: http://rag-service:8400
      INS_CREW_MAX_CONCURRENCY: "2"            # weak machine: at most two LLM-bound requests at once
    env_file: [{path: ../../.keys.env, required: false}]   # INS_LLM_VIRTUAL_KEY / INS_RAG_TOKEN come from the bootstrap scripts
    ports: ["127.0.0.1:8110:8110"]
    mem_limit: 1g

  insurer-ui:
    build: {context: ../.., dockerfile: insurer/ui/Dockerfile}
    profiles: ["insurer"]
    restart: unless-stopped
    environment: {INS_API_URL: "http://insurer-api:8100"}
    ports: ["127.0.0.1:3100:3100"]
    mem_limit: 384m

  insurer-n8n:
    # Orchestration for the insurer API (INS_ORCHESTRATOR=n8n). Host network like the hospital n8n, so the same localhost URLs
    # (API, crew, Keycloak) work; ports shifted because 5679 and 5688 are taken on the dev machine. n8n 2.x, sqlite.
    image: n8nio/n8n:2.41.6
    profiles: ["n8n"]
    restart: unless-stopped
    network_mode: host
    mem_limit: 768m
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      N8N_PORT: ${INS_N8N_PORT:-5689}
      N8N_RUNNERS_BROKER_PORT: ${INS_N8N_BROKER_PORT:-5696}
      N8N_ENCRYPTION_KEY: ${INS_N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_PAYLOAD_SIZE_MAX: "16"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: Asia/Kolkata
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      WEBHOOK_URL: http://localhost:${INS_N8N_PORT:-5689}/
      INS_N8N_WEBHOOK_SECRET: ${INS_N8N_WEBHOOK_SECRET}
      INS_API_URL: http://localhost:${INS_API_PORT:-8600}
      INS_CREW_URL: http://localhost:${INS_CREW_PORT:-8610}
      INS_CREW_SERVICE_TOKEN: ${INS_CREW_SERVICE_TOKEN:-dev}
      INS_KEYCLOAK_TOKEN_URL: http://localhost:8080/realms/insurer/protocol/openid-connect/token
      INS_N8N_CLIENT_ID: insurer-n8n
      INS_N8N_CLIENT_SECRET: ${INS_N8N_CLIENT_SECRET}
    volumes:
      - ../../insurer/n8n/flows:/flows:ro
      - ../../insurer/n8n/active_flows.txt:/active_flows.txt:ro
      - ../../insurer/n8n/entrypoint.sh:/entrypoint.sh:ro
      - insurer_n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${INS_N8N_PORT:-5689}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  insurer_n8n_data:
