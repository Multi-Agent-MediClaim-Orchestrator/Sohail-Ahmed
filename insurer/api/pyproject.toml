[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insurer-api"
version = "0.1.0"
description = "Insurer API: claim receipt, verification, decision gate, query loop, settlement (Dev B)"
requires-python = ">=3.12"
dependencies = [
  "claim-contract", "calc-engine",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "alembic>=1.13",
  "psycopg2-binary>=2.9", "pydantic>=2.7", "pydantic-settings>=2.2", "httpx>=0.27", "redis>=5", "uuid-utils>=0.9",
  "rapidfuzz>=3.6", "jinja2>=3.1", "cryptography>=42", "pyjwt>=2.8", "faker>=24", "prometheus-client>=0.20",
  "arq>=0.25", "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
