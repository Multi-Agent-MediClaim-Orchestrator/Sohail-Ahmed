[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calc-engine"
version = "1.0.0"
description = "Deterministic claim payout calculation engine (Dev B)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "claim-contract", "fastapi>=0.110", "pyjwt>=2.8", "uvicorn>=0.29"]

[tool.setuptools.packages.find]
where = ["."]
include = ["calc_engine*"]
