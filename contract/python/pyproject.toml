[project]
name = "claim-contract"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "starlette>=0.37", "redis>=5.0"]
[dependency-groups]
dev = ["httpx>=0.27", "fakeredis>=2.20", "openapi-spec-validator>=0.7", "pyyaml>=6", "pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["claim_contract"]
[tool.mypy]
strict = true
