    WithdrawRequest:
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/WithdrawReason'
        note:
          anyOf:
          - maxLength: 1000
            type: string
          - type: 'null'
          default: null
          title: Note
      required:
      - reason
      title: WithdrawRequest
      type: object
  parameters:
    ContractVersion:
      name: X-Contract-Version
      in: header
      required: true
      description: MAJOR.MINOR, e.g. 1.1
      schema:
        type: string
        pattern: ^1\.\d+$
    KeyId:
      name: X-Key-Id
      in: header
      required: true
      description: HMAC key id, e.g. hosp-001
      schema:
        type: string
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: RFC 3339 UTC seconds, skew limit 300 s
      schema:
        type: string
    Signature:
      name: X-Signature
      in: header
      required: true
      description: "base64 HMAC-SHA256 of the canonical string (see 01-01 \xA74)"
      schema:
        type: string
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      description: UUID; required on mutating calls
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: optional trace id, 1-64 chars of A-Za-z0-9._-
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    JourneyId:
      name: X-Journey-Id
      in: header
      required: false
      description: 'v1.1: UUID following a claim across both systems'
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 7807 problem (code in bad_request, doc_unavailable, duplicate_claim, forbidden,
        forbidden_role, hospital_blacklisted, hospital_mismatch, idempotency_conflict, idempotency_in_progress,
        internal_error, invalid_signature, invalid_transition, not_found, not_your_claim, payload_too_large,
        query_closed, rate_limited, request_in_progress, service_unavailable, stale_etag, stale_request,
        totals_mismatch, unknown_claim, unknown_document, unknown_query, unsupported_version, validation_error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
