openapi: 3.1.0
info:
  title: Hospital <-> Insurer claims contract
  version: 1.1.0
  description: Joint contract (both developers approve changes). Generated from claim_contract.
paths:
  /v1/hospital-api/claims:
    post:
      tags:
      - hospital->insurer
      operationId: submitClaim
      summary: Submit claim
      parameters:
      - &id001
        $ref: '#/components/parameters/ContractVersion'
      - &id002
        $ref: '#/components/parameters/KeyId'
      - &id003
        $ref: '#/components/parameters/Timestamp'
      - &id004
        $ref: '#/components/parameters/Signature'
      - &id005
        $ref: '#/components/parameters/RequestId'
      - &id006
        $ref: '#/components/parameters/JourneyId'
      - &id007
        $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimSubmission'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '424':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/hospital-api/claims/{claim_ref}:
    get:
      tags:
      - hospital->insurer
      operationId: getClaimStatus
      summary: Current status
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - &id008
        name: claim_ref
        in: path
        required: true
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: string
          enum:
          - queries
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusUpdate'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/hospital-api/claims/{claim_ref}/documents:
    post:
      tags:
      - hospital->insurer
      operationId: supplementDocuments
      summary: Supplement documents
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocSupplement'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/hospital-api/claims/{claim_ref}/queries:
    get:
      tags:
      - hospital->insurer
      operationId: listQueries
      summary: List queries
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id008
      responses:
        '200':
          description: Paginated queries
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/hospital-api/queries/{query_id}/responses:
    post:
      tags:
      - hospital->insurer
      operationId: respondToQuery
      summary: Answer a query
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - name: query_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryResponse'
      responses:
        '202':
          description: Accepted
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/hospital-api/claims/{claim_ref}/withdraw:
    post:
      tags:
      - hospital->insurer
      operationId: withdrawClaim
      summary: Withdraw claim
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '200':
          description: Withdrawn
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/insurer-callbacks/status:
    post:
      tags:
      - insurer->hospital
      operationId: callbackStatus
      summary: Status push
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '204':
          description: Received
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/insurer-callbacks/queries:
    post:
      tags:
      - insurer->hospital
      operationId: callbackQuery
      summary: New query
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
      responses:
        '204':
          description: Received
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/insurer-callbacks/decisions:
    post:
      tags:
      - insurer->hospital
      operationId: callbackDecision
      summary: Decision
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '204':
          description: Received
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/insurer-callbacks/settlements:
    post:
      tags:
      - insurer->hospital
      operationId: callbackSettlement
      summary: Settlement
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementNotice'
      responses:
        '204':
          description: Received
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /v1/insurer-callbacks/documents/{doc_id}/refresh-url:
    post:
      tags:
      - insurer->hospital
      operationId: refreshDocumentUrl
      summary: Re-presign (v1.1)
      parameters:
      - *id001
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocRefreshRequest'
      responses:
        '200':
          description: New URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocRefreshResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
  /v1/health:
    get:
      tags:
      - utility
      operationId: health
      summary: Health (unsigned)
      responses:
        '200':
          description: ok
        '503':
          $ref: '#/components/responses/Problem'
  /v1/contract:
    get:
      tags:
      - utility
      operationId: contractInfo
      summary: Supported versions (unsigned)
      responses:
        '200':
          description: versions
components:
  schemas:
    Acknowledgement:
      additionalProperties: false
      properties:
        claim_ref:
          title: Claim Ref
          type: string
        insurer_claim_no:
          pattern: ^IC-\d{4}-\d{6}$
          title: Insurer Claim No
          type: string
        status:
          $ref: '#/components/schemas/InsurerCaseStatus'
        received_at:
          format: date-time
          title: Received At
          type: string
        sequence:
          minimum: 0
          title: Sequence
          type: integer
        document_ingest:
          additionalProperties:
            type: integer
          title: Document Ingest
          type: object
        contract_version:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Contract Version
      required:
      - claim_ref
      - insurer_claim_no
      - status
      - received_at
      - sequence
      title: Acknowledgement
      type: object
    Admission:
      additionalProperties: false
      properties:
        admission_type:
          $ref: '#/components/schemas/AdmissionType'
        admitted_on:
          format: date
          title: Admitted On
          type: string
        discharged_on:
          format: date
          title: Discharged On
          type: string
        diagnosis_codes:
          items:
            type: string
          maxItems: 10
          minItems: 1
          title: Diagnosis Codes
          type: array
        procedure_codes:
          items:
            type: string
          maxItems: 10
          title: Procedure Codes
          type: array
        treating_doctor:
          maxLength: 120
          minLength: 2
          title: Treating Doctor
          type: string
        hospital_id:
          pattern: ^HOSP-\d{4}$
          title: Hospital Id
          type: string
        preauth_ref:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Preauth Ref
        length_of_stay_days:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Length Of Stay Days
      required:
      - admission_type
      - admitted_on
      - discharged_on
      - diagnosis_codes
      - treating_doctor
      - hospital_id
      title: Admission
      type: object
    AdmissionType:
      enum:
      - planned
      - emergency
      title: AdmissionType
      type: string
    BillCategory:
      enum:
      - room
      - icu
      - surgery
      - anaesthesia
      - medicine
      - consumable
      - implant
      - investigation
      - consultation
      - other
      title: BillCategory
      type: string
    BillLine:
      additionalProperties: false
      properties:
        line_id:
          anyOf:
          - maxLength: 16
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Line Id
        code:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Code
        description:
          maxLength: 200
          minLength: 2
          title: Description
          type: string
        category:
          $ref: '#/components/schemas/BillCategory'
        qty:
          decimal_places: 3
          title: Qty
          type: string
        unit_price:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        service_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          default: null
          title: Service Date
        source_doc_id:
          format: uuid
          title: Source Doc Id
          type: string
        source_page:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Source Page
      required:
      - description
      - category
      - qty
      - unit_price
      - amount
      - source_doc_id
      title: BillLine
      type: object
    Citation:
      additionalProperties: false
      properties:
        source_id:
          title: Source Id
          type: string
        clause:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Clause
        page:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Page
        snippet:
          maxLength: 300
          title: Snippet
          type: string
      required:
      - source_id
      - snippet
      title: Citation
      type: object
    ClaimSubmission:
      additionalProperties: false
      properties:
        contract_version:
          pattern: ^\d+\.\d+$
          title: Contract Version
          type: string
        claim_ref:
          pattern: ^HC-\d{4}-\d{6}$
          title: Claim Ref
          type: string
        claim_type:
          $ref: '#/components/schemas/ClaimType'
        patient:
          $ref: '#/components/schemas/Patient'
        admission:
          $ref: '#/components/schemas/Admission'
        bill_lines:
          items:
            $ref: '#/components/schemas/BillLine'
          maxItems: 2000
          minItems: 1
          title: Bill Lines
          type: array
        totals:
          $ref: '#/components/schemas/ClaimTotals'
        documents:
          items:
            $ref: '#/components/schemas/DocumentRef'
          maxItems: 100
          minItems: 1
          title: Documents
          type: array
        config_versions:
          $ref: '#/components/schemas/ConfigVersions'
        journey_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Journey Id
        submitted_at:
          format: date-time
          title: Submitted At
          type: string
        hospital_notes:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Hospital Notes
      required:
      - contract_version
      - claim_ref
      - claim_type
      - patient
      - admission
      - bill_lines
      - totals
      - documents
      - config_versions
      - submitted_at
      title: ClaimSubmission
      type: object
    ClaimTotals:
      additionalProperties: false
      properties:
        gross:
          $ref: '#/components/schemas/Money'
        discounts:
          $ref: '#/components/schemas/Money'
        claimed:
          $ref: '#/components/schemas/Money'
        patient_paid_advance:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
          default: null
      required:
      - gross
      - discounts
      - claimed
      title: ClaimTotals
      type: object
    ClaimType:
      enum:
      - cashless
      - reimbursement
      title: ClaimType
      type: string
    ConfigVersions:
      additionalProperties: false
      properties:
        doc_requirements:
          minimum: 1
          title: Doc Requirements
          type: integer
        deadlines:
          minimum: 1
          title: Deadlines
          type: integer
        router_rules:
          minimum: 1
          title: Router Rules
          type: integer
        confidence_gates:
          minimum: 1
          title: Confidence Gates
          type: integer
      required:
      - doc_requirements
      - deadlines
      - router_rules
      - confidence_gates
      title: ConfigVersions
      type: object
    Decision:
      additionalProperties: false
      properties:
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        approved_amount:
          $ref: '#/components/schemas/Money'
        deductions:
          items:
            $ref: '#/components/schemas/Deduction'
          title: Deductions
          type: array
        reason_codes:
          items:
            type: string
          title: Reason Codes
          type: array
        reviewer_ids:
          items:
            type: string
          maxItems: 3
          minItems: 1
          title: Reviewer Ids
          type: array
        calc_trace_id:
          format: uuid
          title: Calc Trace Id
          type: string
        policy_version:
          minimum: 1
          title: Policy Version
          type: integer
        decided_at:
          format: date-time
          title: Decided At
          type: string
        supersedes:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Supersedes
      required:
      - outcome
      - approved_amount
      - reviewer_ids
      - calc_trace_id
      - policy_version
      - decided_at
      title: Decision
      type: object
    DecisionOutcome:
      enum:
      - approve
      - partial
      - reject
      - needs_info
      title: DecisionOutcome
      type: string
    Deduction:
      additionalProperties: false
      properties:
        line_ref:
          title: Line Ref
          type: string
        rule_id:
          title: Rule Id
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        explanation:
          maxLength: 500
          title: Explanation
          type: string
      required:
      - line_ref
      - rule_id
      - amount
      - explanation
      title: Deduction
      type: object
    DocRefreshRequest:
      additionalProperties: false
      properties:
        claim_ref:
          title: Claim Ref
          type: string
        reason:
          const: url_expired
          default: url_expired
          title: Reason
          type: string
      required:
      - claim_ref
      title: DocRefreshRequest
      type: object
    DocRefreshResponse:
      additionalProperties: false
      properties:
        doc_id:
          format: uuid
          title: Doc Id
          type: string
        download_url:
          format: uri
          maxLength: 2083
          minLength: 1
          title: Download Url
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        size_bytes:
          minimum: 1
          title: Size Bytes
          type: integer
      required:
      - doc_id
      - download_url
      - expires_at
      - sha256
      - size_bytes
      title: DocRefreshResponse
      type: object
    DocSupplement:
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/DocSupplementReason'
        query_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          default: null
          title: Query Id
        documents:
          items:
            $ref: '#/components/schemas/DocumentRef'
          maxItems: 100
          minItems: 1
          title: Documents
          type: array
      required:
      - reason
      - documents
      title: DocSupplement
      type: object
    DocSupplementReason:
      enum:
      - query_response
      - voluntary
      - correction
      title: DocSupplementReason
      type: string
    DocType:
      enum:
      - prescription
      - procedure_bill
      - discharge_summary
      - final_bill
      - itemised_bill
      - pharmacy_bill
      - lab_report
      - radiology_report
      - investigation_report
      - admission_note
      - preauth_approval
      - claim_form
      - id_proof
      - policy_card
      - cancelled_cheque
      - implant_sticker
      - payment_receipt
      - fir_mlc
      - other
      title: DocType
      type: string
    DocumentRef:
      additionalProperties: false
      properties:
        doc_id:
          format: uuid
          title: Doc Id
          type: string
        doc_type:
          $ref: '#/components/schemas/DocType'
        filename:
          maxLength: 200
          minLength: 1
          pattern: ^[^/\\]+$
          title: Filename
          type: string
        sha256:
          pattern: ^[0-9a-f]{64}$
          title: Sha256
          type: string
        size_bytes:
          maximum: 25000000
          minimum: 1
          title: Size Bytes
          type: integer
        mime_type:
          anyOf:
          - enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/tiff
            type: string
          - type: 'null'
          default: null
          title: Mime Type
        download_url:
          format: uri
          maxLength: 2083
          minLength: 1
          title: Download Url
          type: string
        url_expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Url Expires At
        parse_confidence:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          title: Parse Confidence
        pages:
          maximum: 300
          minimum: 1
          title: Pages
          type: integer
        received_via:
          default: upload
          enum:
          - upload
          - scan
          - email
          - supplement
          title: Received Via
          type: string
      required:
      - doc_id
      - doc_type
      - filename
      - sha256
      - size_bytes
      - download_url
      - pages
      title: DocumentRef
      type: object
    FieldError:
      properties:
        field:
          title: Field
          type: string
        message:
          title: Message
          type: string
      required:
      - field
      - message
      title: FieldError
      type: object
    Gender:
      enum:
      - M
      - F
      - O
      title: Gender
      type: string
    HospitalCaseStatus:
      enum:
      - draft
      - docs_pending
      - docs_complete
      - building_claim
      - ready_for_review
      - submitted
      - acknowledged
      - under_query
      - approved
      - partially_approved
      - rejected
      - settled
      - closed
      title: HospitalCaseStatus
      type: string
    InsurerCaseStatus:
      enum:
      - received
      - verifying
      - needs_info
      - ready_for_decision
