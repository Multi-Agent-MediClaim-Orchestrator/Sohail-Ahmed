[project]
name = "synth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["faker>=24", "reportlab>=4", "pillow>=10", "numpy>=1.26", "opencv-python-headless>=4.9", "pyyaml>=6", "httpx>=0.27"]
[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["synth"]
