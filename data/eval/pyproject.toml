[project]
name = "evalh"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["synth", "doc-pipeline", "vision-service", "numpy>=1.26"]
[tool.uv.sources]
synth = { workspace = true }
doc-pipeline = { workspace = true }
vision-service = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "scikit-learn>=1.4"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["evalh"]
