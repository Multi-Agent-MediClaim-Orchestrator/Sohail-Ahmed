[project]
name = "claims-monorepo"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["contract/python", "hospital/api"]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501"]  # ruff format owns code wrapping; docstrings and comments may run long
[tool.ruff.lint.per-file-ignores]
"infra/tests/**" = ["S101", "S603", "S607"]
"hospital/api/alembic/versions/*" = ["E501"]   # raw DDL copied from the spec
"hospital/api/app/models/*" = ["E501", "UP042"]  # generated from the migrated schema
"hospital/api/tests/*" = ["S101", "S608", "E501", "S311"]
"hospital/api/app/**" = ["B008"]  # FastAPI Depends() defaults
"hospital/api/app/services/cases.py" = ["S608"]
"hospital/api/app/services/documents.py" = ["S608", "B007"]  # SQL built only from constants and validated model field names
"hospital/api/seed/*" = ["S311", "E501"]  # seeded fake data, not security-sensitive
"**/tests/**" = ["S101"]

[tool.pytest.ini_options]
markers = ["unit", "integration", "contract", "e2e", "slow", "llm"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["contract/python"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "schemathesis>=4.29.4",
    "uvicorn>=0.54.0",
]
