[project]
name = "hospital-crew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["claim-contract", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6"]
[tool.uv.sources]
claim-contract = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["crew"]
