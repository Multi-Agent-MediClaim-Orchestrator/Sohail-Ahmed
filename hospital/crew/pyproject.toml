[project]
name = "hospital-crew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["claim-contract", "calc-engine", "pyjwt>=2.8", "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6", "crewai[litellm]==1.15.23"]
[project.scripts]
kickoff = "crew.demo:kickoff"
run_crew = "crew.demo:kickoff"
plot = "crew.demo:plot"

[tool.crewai]
type = "flow"
project_id = "31504d07-12b3-4291-8967-db77bebff864"

[tool.uv.sources]
claim-contract = { workspace = true }
calc-engine = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["crew"]
