[project]
name = "hospital-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "claim-contract",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.2",
  "uuid-utils>=0.9",
  "faker>=24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "redis>=5.0",
  "minio>=7.2",
  "pikepdf>=9",
  "pillow>=10",
  "rapidfuzz>=3.6",
]
[tool.uv.sources]
claim-contract = { workspace = true }
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "fakeredis>=2.20"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
