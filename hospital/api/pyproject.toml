[project]
name = "hospital-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "claim-contract",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.2",
  "uuid-utils>=0.9",
  "faker>=24",
]
[tool.uv.sources]
claim-contract = { workspace = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
